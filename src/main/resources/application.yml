spring:
  application:
    name: my-ledger-backend

  # H2 Database 설정
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/ledger
    username: sa
    password:

  # H2 Console 설정
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: update
  properties:
    hibernate:
      format_sql: true
      show_sql: true

  server:
    port: 8080
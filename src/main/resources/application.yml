spring:
  application:
    name: my-finance-manager-backend


  # PostgreSQL Database 설정
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/my_finance_manager
    username: postgres
    password: postgres

  # JPA 설정
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # data.sql 실행 안 함
  sql:
    init:
      mode: never

server:
  port: 8080